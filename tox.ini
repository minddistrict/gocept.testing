[tox]
envlist =
    py310,
    py311,
    py312,
    py313,
    py314,
    py315,
    pypy3,
    coverage,
minversion = 1.6

[testenv]
usedevelop = True
deps = pytest
commands = py.test []

[testenv:coverage]
basepython = python3
deps =
    {[testenv]deps}
    pytest-cov
    coverage
commands =
    py.test --cov=src --cov-report=html []
